<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Controller App</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #121212; color: #fff; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px; cursor: pointer; background: #1db954; color: white; border: none; border-radius: 20px; }
        button:active { background: #1aa34a; }
        .card { background: #282828; padding: 20px; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>🎵 Multi-Device Music Controller</h2>
    
    <div class="card">
        <h3>Player Node</h3>
        <audio id="audioPlayer" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto"></audio>
        <p id="status">Status: Disconnected</p>
    </div>

    <div class="card">
        <h3>Remote Commands</h3>
        <button onclick="sendAction('PLAY')">Play</button>
        <button onclick="sendAction('PAUSE')">Pause</button>
    </div>

    <script>
        const ws = new WebSocket('wss://echo.websocket.events');
        const player = document.getElementById('audioPlayer');
        const statusText = document.getElementById('status');

        ws.onopen = () => {
            statusText.innerText = "Status: Connected to Server";
        };

        ws.onclose = () => {
            statusText.innerText = "Status: Disconnected";
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                if (data.action === 'PLAY') {
                    player.play();
                    statusText.innerText = "Status: Playing via Remote Command";
                } else if (data.action === 'PAUSE') {
                    player.pause();
                    statusText.innerText = "Status: Paused via Remote Command";
                }
            } catch (e) {}
        };

        function sendAction(actionType) {
            const payload = JSON.stringify({ action: actionType });
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(payload);
            }
        }
    </script>

</body>
</html>
