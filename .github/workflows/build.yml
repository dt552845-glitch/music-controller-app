name: Build WebView APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Download WebView Project Wrapper
      run: |
        git clone https://github.com/Sinnefa/Android-Webview-Based-App-Template.git temp_android
        cp index.html temp_android/app/src/main/assets/index.html || true

    - name: Build Debug APK with Gradle
      run: |
        cd temp_android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: music-app-apk
        path: temp_android/app/build/outputs/apk/debug/app-debug.apk
